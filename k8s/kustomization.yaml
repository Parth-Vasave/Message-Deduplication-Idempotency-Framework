# Apply all manifests at once:
#   kubectl apply -k k8s/
#
# Or with kustomize directly:
#   kustomize build k8s/ | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafkadedup

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - service-api.yaml
  - deployment-api.yaml
  - deployment-consumer.yaml
  - hpa-consumer.yaml
  - poddisruptionbudget.yaml
  - servicemonitor.yaml
  - ingress.yaml

# Override the image tag at deploy time:
#   kustomize edit set image ghcr.io/YOUR_ORG/kafkadedup=ghcr.io/YOUR_ORG/kafkadedup:abc1234
images:
  - name: ghcr.io/YOUR_ORG/kafkadedup
    newTag: latest
