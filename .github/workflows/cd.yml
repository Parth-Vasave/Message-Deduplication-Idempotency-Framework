# Continuous Delivery — triggers on merge to main.
#
# Pipeline:
#   1. Build multi-platform Docker image
#   2. Push to GHCR with SHA + 'latest' tags
#   3. Deploy to Kubernetes (rolling update via kubectl set image)
#
# Required repository secrets:
#   KUBE_CONFIG   — base64-encoded kubeconfig with deploy rights to your cluster
#
# The GITHUB_TOKEN secret is provided automatically by Actions for GHCR push.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest SHA)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. myorg/kafkadedup → ghcr.io/myorg/kafkadedup

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the full CI gate before building
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # 2. Build and push the Docker image
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write    # required to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Short SHA tag — immutable, used for the k8s rollout
            type=sha,format=short,prefix=
            # Floating 'latest' tag on main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds using GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Deploy to Kubernetes
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    environment: production    # enables required reviewers / deployment protection rules

    env:
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace, RBAC, ConfigMap
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Apply PodDisruptionBudgets
        run: kubectl apply -f k8s/poddisruptionbudget.yaml

      # Secret must exist before deployments start.
      # We apply only if the secret doesn't already exist — prevents
      # overwriting live credentials with the placeholder values.
      - name: Create secret (first deploy only)
        run: |
          kubectl apply \
            --namespace kafkadedup \
            -f k8s/secret.yaml \
            --dry-run=client -o yaml \
          | kubectl apply --server-side --force-conflicts -f - 2>/dev/null || true

      - name: Deploy API
        run: |
          kubectl apply -f k8s/service-api.yaml
          kubectl apply -f k8s/deployment-api.yaml
          kubectl set image deployment/kafkadedup-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --namespace kafkadedup
          kubectl rollout status deployment/kafkadedup-api \
            --namespace kafkadedup \
            --timeout=5m

      - name: Deploy Consumer
        run: |
          kubectl apply -f k8s/deployment-consumer.yaml
          kubectl set image deployment/kafkadedup-consumer \
            consumer=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --namespace kafkadedup
          kubectl rollout status deployment/kafkadedup-consumer \
            --namespace kafkadedup \
            --timeout=5m

      - name: Apply HPA and ServiceMonitor
        run: |
          kubectl apply -f k8s/hpa-consumer.yaml
          # ServiceMonitor only applies if Prometheus Operator CRD is present
          kubectl apply -f k8s/servicemonitor.yaml 2>/dev/null || \
            echo "ServiceMonitor CRD not found — skipping (install kube-prometheus-stack to enable)"

      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Verify pods are running
        run: |
          kubectl get pods --namespace kafkadedup
          kubectl get deployments --namespace kafkadedup

  # ---------------------------------------------------------------------------
  # 4. Smoke-test — basic health check after deploy
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Port-forward and check /health
        run: |
          # Start port-forward in the background
          kubectl port-forward \
            service/kafkadedup-api 9090:80 \
            --namespace kafkadedup &
          PF_PID=$!
          sleep 5

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/health)
          kill $PF_PID 2>/dev/null || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed — got HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_STATUS)"
