global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "topic"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "default"
      repeat_interval: 1h

receivers:
  - name: "default"
    # Add your notification channel here.
    # Examples: slack_configs, pagerduty_configs, email_configs
    # See https://prometheus.io/docs/alerting/latest/configuration/

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "topic"]
